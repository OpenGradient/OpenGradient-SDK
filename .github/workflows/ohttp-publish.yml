name: opengradient-ohttp publish

# Manual run → TestPyPI. Tag ohttp-v<version> → PyPI.
# Both use PyPI trusted publishing (OIDC); no API tokens are stored.
on:
  workflow_dispatch:
  push:
    tags: ["ohttp-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/opengradient-ohttp
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv run --extra test pytest -q
      - name: Tag matches package version
        if: startsWith(github.ref, 'refs/tags/ohttp-v')
        run: |
          VERSION=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' src/opengradient_ohttp/_version.py)
          test "ohttp-v$VERSION" = "${GITHUB_REF_NAME}" || { echo "tag ${GITHUB_REF_NAME} != ohttp-v$VERSION"; exit 1; }
      - run: uv build
      - run: uvx twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: packages/opengradient-ohttp/dist/

  testpypi:
    needs: build
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    needs: build
    if: startsWith(github.ref, 'refs/tags/ohttp-v')
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
